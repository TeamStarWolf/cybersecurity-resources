name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job only reads the checkout.
permissions:
  contents: read

jobs:
  validate:
    name: Data rules, drift, and the compact set
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the pinned YAML reader
        run: python -m pip install --require-hashes --no-deps -r requirements.txt

      # LINKS.md and bookmarks.html are compared by hash, so no tracked text file may carry a CR.
      - name: Line endings are LF
        run: |
          if git grep -I -l $'\r' -- . ; then
            echo "The files above contain CR line endings."
            exit 1
          fi

      - name: Validator rejects its planted faults
        run: python scripts/validate.py --self-test

      - name: Data follows the rules
        run: python scripts/validate.py

      # Every generated file must be what the data produces, and LINKS.md and bookmarks.html
      # must match the hashes recorded in data/compact.lock.
      - name: Generated files match the data
        run: python scripts/build.py --check

      # Controls: the drift check must fail on a changed generated file and on a changed compact set.
      - name: Drift check rejects planted changes
        run: |
          printf '\n' >> INDEX.md
          if python scripts/build.py --check; then
            echo "A changed generated file was not detected."
            exit 1
          fi
          git checkout -- INDEX.md
          sed -i '0,/label: "/s//label: "Planted /' data/compact.yaml
          if python scripts/build.py --check; then
            echo "A changed compact set was not detected."
            exit 1
          fi
          git checkout -- data/compact.yaml
          python scripts/build.py --check

      - name: Link checker rejects a dead address
        run: python scripts/check_links.py --self-test
