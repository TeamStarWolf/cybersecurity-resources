# Addresses the automated link check skips, each with the reason and the date it was last opened by hand.
# An address belongs here only if it fails for an automated client while the resource itself is fine.
# scripts/build.py writes .lycheeignore from this list; scripts/check_links.py reads it directly.
# "url" is matched as a prefix.
# An entry marked "only: ci" is skipped by the CI link check alone: the address refuses requests from
# GitHub-hosted runners but answers a desktop network, so scripts/check_links.py still requires it to answer.

