# Addresses the automated link check skips, each with the reason and the date it was last opened by hand.
# An address belongs here only if it fails for an automated client while the resource itself is fine.
# scripts/build.py writes .lycheeignore from this list; scripts/check_links.py reads it directly.
#
# max_share_percent: the largest share of the catalog's published addresses this list may cover.
#   scripts/validate.py prints the current share and fails above this number, so the list cannot
#   grow quietly until the link check stops meaning anything. Raise it only on purpose.
# match: exact  skips that one address.
# match: prefix skips every address that starts with "url", which must end with a slash.
# only: ci      the entry applies to the CI link check alone: the address refuses requests from
#               GitHub-hosted runners but answers a desktop network, so scripts/check_links.py
#               still requires it to answer.

max_share_percent: 10

entries:
