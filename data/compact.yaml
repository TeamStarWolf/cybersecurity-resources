# The compact bookmark set: the folder tree that LINKS.md and bookmarks.html are generated from.
# Another TeamStarWolf system reads LINKS.md, so its shape is fixed: at most 16 folders,
# at most 16 subsections in a folder, and at most 16 links in a list.
# Each link names a resource id and the label to show. A link with its own "url" is pinned to
# that address; without one it uses the resource's current address.

title: "Cybersecurity Resources"
